spring.application.name=Trocabook

spring.mvc.contentnegotiation.favor-path-extension=true
spring.mvc.contentnegotiation.ignore-accept-header=true

spring.resources.cache.period=0685
spring.resources.static-locations=classpath:/static/

google.recaptcha.key.site=${RECAPTCHA_SITE_KEY:6LckZKgtAAAAAMIlXZRXGUuxnkyssgjjcqmbBdo7}
google.recaptcha.key.secret=${RECAPTCHA_SECRET_KEY}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD} 
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.debug=true


server.servlet.session.cookie.same-site=Strict

file.upload-dir=${FILE_UPLOAD_DIR:/tmp/uploads}

# Caminho apontando para a pasta credentials dentro de resources
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:classpath:credentials/trocabook-92297-firebase-adminsdk-fbsvc-d737f4aa9e.json}
google.books.api.key=${GOOGLE_BOOKS_API_KEY}


recomendacao.service.url=${RECOMENDACAO_SERVICE_URL}
jwt.admin.public.key.path=${JWT_ADMIN_PUBLIC_KEY_PATH}