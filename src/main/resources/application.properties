spring.application.name=Trocabook

# ============================================================
# GESTÃO DE CONTEÚDO E RECURSOS ESTÁTICOS
# ============================================================
spring.mvc.contentnegotiation.favor-path-extension=true
spring.mvc.contentnegotiation.ignore-accept-header=true
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0685

# ============================================================
# PERFORMANCE & OTIMIZAÇÃO DE STARTUP NO AZURE
# ============================================================
# Carrega o DispatcherServlet logo no boot (evita o Cold Start na 1ª requisição)
spring.mvc.servlet.load-on-startup=1

# Desativa exportações de métricas/refresh desnecessários no arranque
management.defaults.metrics.export.enabled=false
spring.cloud.refresh.enabled=false

# Limites de tempo (Timeout) para chamadas externas via OpenFeign
spring.cloud.openfeign.client.config.default.connectTimeout=1500
spring.cloud.openfeign.client.config.default.readTimeout=2000

# Pool de Conexões HikariCP (Otimizado para requisições rápidas e login)
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.validation-timeout=3000

# ============================================================
# SESSÃO E SEGURANÇA DE COOKIES
# ============================================================
server.servlet.session.cookie.same-site=Strict

# ============================================================
# ARMAZENAMENTO E DIRETÓRIO DE UPLOADS (LINUX / AZURE)
# ============================================================
# Utiliza caminho persistente do Linux no Azure App Service
file.upload-dir=${FILE_UPLOAD_DIR:/home/site/wwwroot/uploads}

# ============================================================
# RECAPTCHA E GOOGLE APIS
# ============================================================
google.recaptcha.key.site=${RECAPTCHA_SITE_KEY:6LckZKgtAAAAAMIlXZRXGUuxnkyssgjjcqmbBdo7}
google.recaptcha.key.secret=${RECAPTCHA_SECRET_KEY}
google.books.api.key=${GOOGLE_BOOKS_API_KEY}

# ============================================================
# CONFIGURAÇÃO DE E-MAIL (SMTP GMAIL)
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD} 
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.debug=true

# ============================================================
# INTEGRAÇÃO FIREBASE E SERVIÇOS/MICROSSERVIÇOS
# ============================================================
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH}
jwt.admin.public.key.path=${JWT_ADMIN_PUBLIC_KEY_PATH}

chat.service.url=${CHAT_SERVICE_URL:http://localhost:8282}
chat.service.fallback-url=https://trocabookchatservice.onrender.com
recomendacao.service.url=${RECOMENDACAO_SERVICE_URL}
analytics.service.url=${ANALYTICS_SERVICE_URL}

# ============================================================
# URL BASE DA APLICAÇÃO (USADO EM LINKS DE E-MAIL / REDEFINIÇÃO)
# ============================================================
app.base-url=${APP_BASE_URL:https://trocabook-web-cme0guh4a8btf7fd.eastus2-01.azurewebsites.net}