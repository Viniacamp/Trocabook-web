<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/img/logo-trocabook.png"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="/css/style.css">

    <title>Esqueci a Senha | Trocabook</title>
</head>

<body>

<div class="container">

    <style>
        body {
            background-color: rgb(236, 236, 236);
            background-size: cover;
        }
    </style>

    <div class="wrapper">

        <div class="loginlogo">
            <a href="/">
                <img src="/img/Design sem nome (4).svg">
            </a>
        </div>

        <div vw class="enabled">
            <div vw-access-button class="active"></div>

            <div vw-plugin-wrapper>
                <div class="vw-plugin-top-wrapper"></div>
            </div>
        </div>

        <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

        <script>
            new window.VLibras.Widget('https://vlibras.gov.br/app');
        </script>

        <form class="login" method="post" th:action="@{/esqueci-senha}">

            <h1>
                <b>Redefinir Senha</b>
            </h1>

            <p>
                Por favor, insira o seu e-mail de cadastro.
                Enviaremos um link para você poder criar uma nova senha.
            </p>

            <div
                    th:if="${sucesso}"
                    class="alert alert-success"
                    th:text="${sucesso}">
            </div>

            <div
                    th:if="${erro}"
                    class="alert alert-danger"
                    th:text="${erro}">
            </div>

            <div class="row mb-3">

                <label
                        for="email"
                        class="col-sm-2 col-form-label">

                    Email:

                </label>

                <div class="col-sm-10">

                    <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            required>

                </div>

            </div>

            <button
                    type="submit"
                    class="btn btn-primary">

                Enviar Link de Redefinição

            </button>

            <div class="mt-3">

                <a href="/login">
                    Voltar para o Login
                </a>

            </div>

        </form>

    </div>

    <br>
    <br>
    <br>

    <footer>

        <div class="rodapenovo">

            <a href="/">
                <img src="/img/Design sem nome.svg">
            </a>

            <a href="/sobreNos">
                <p>
                    Conheça nosso incrível projeto
                    <br>
                    de incentivo a reutilização
                </p>
            </a>

            <a href="/ajuda">
                <p>Central de ajuda</p>
            </a>

            <small>
                © 2026 Sistema Trocabook
                <br>
                Todos os direitos reservados
            </small>

        </div>

    </footer>

</div>

</body>
</html>
