<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/img/logo-trocabook.png"/>
    <link rel="stylesheet" type="text/css" href="/css/style.css"/>
    <title>Home | Trocabook</title>
</head>
<body th:attr="data-application-instance=${applicationInstance}">
<div class="container">
    <header>
        <div class="wrapper">
            <table class="cabecalho"><tr>
                <th id="cabecalhoelementos">
                    <a href="/"><img src="/img/Design sem nome (7).svg"></a>
                    <div class="autocomplete-wrapper">
                        <input type="text" id="pesquisa" placeholder="Pesquisar">
                        <div id="resultadosPesquisa" class="sugestoes-autocomplete"></div>
                    </div>

                    <th:block sec:authorize="isAuthenticated()">
                        <div class="user-menu-container">
                            <button id="userMenuBtn" class="user-menu-btn" onclick="toggleMenu()">
                                <img th:src="${usuario.fotoPerfil}" class="user-menu-icon">
                                <span>Olá, <span th:text="${usuario.nome}" style="text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.25);"></span>
                                <span class="arrow">▼</span>
                            </button>
                            
                            <div id="userDropdown" class="dropdown-content">
                                <a class="anunciar-livro4" href="/AnunciarLivro">Anunciar Livro</a>
                                <a class="meus-livros4" href="/MeusLivros">Meus Livros</a>
                                <a href="chat/chat">Chat</a>
                                <hr class="divider">
                                <button type="submit" id="deslogar" class="logout-btn">Sair</button>
                            </div>
                        </div>
                    </th:block>

                    <th:block sec:authorize="!isAuthenticated()">
                        <a href="/login" id="loginbotao"><button type="submit" style="width: 150px; height:37px;">Fazer login</button></a>
                    </th:block>
                </th></tr>
            </table>
        </div>
    </header>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    <div class="banner">
        <h1 id="saudacao"></h1>
        <br><img class="banner" src="/img/Banner.png">
    </div>
    <table class="negociadores">
        <tr>
            <th><h1>Negociantes em Destaque</h1>
                <div class="responsive-destaques">
                    <div th:each="destaque : ${destaques}">
                        <a th:href="@{'/destaque/' + ${destaque.id}}">
                            <img th:src="${destaque.fotoPerfil}" alt="Usuário em destaque">
                        </a>
                    </div>
                </div>
            </th>
    </table>

    <div class="livros">
        <h2>Propostas recentes</h2>

        <section class="livros-grid">

            <div class="livro-card" th:each="anuncio : ${anuncios}">

                <img th:src="${anuncio.capa}"
                     class="capaLivros"
                     alt="Capa do livro">

                <p th:text="${anuncio.titulo}"></p>

                <th:block sec:authorize="isAuthenticated()">

                    <a th:href="@{/chat/conversar(
                        anuncio=${anuncio.id},
                        remetente=${usuario.id},
                        destinatario=${anuncio.uidUsuario}
                    )}">
                        <button type="button">Negociar</button>
                    </a>

                </th:block>

                <th:block sec:authorize="!isAuthenticated()">

                    <a href="/login">
                        <button type="button">Negociar</button>
                    </a>

                </th:block>

            </div>

        </section>

        <a style="text-decoration: none" href="/livros">
            <p style="text-align: right;
                  text-decoration: none;
                  color:#007BFF">
                &gt; Ver todos os anúncios
            </p>
        </a>

        <br><br><br>
    </div>

    <footer>
        <div class="rodapenovo">
            <a href="/"><img src="/img/Design sem nome.svg"></a>
            <a href="/sobreNos"><p>Conheça nosso incrível projeto <br>de incentivo a reutilização</p></a>
            <a href="/ajuda"><p>Central de ajuda</p></a>
            <small>© 2026 Sistema Trocabook<br>Todos os direitos reservados</small>
        </div>
    </footer>
</div>
</body>
<script src="/js/fetch.js"></script>
<script type="module" src="/js/logout.js"></script>
<script src="/js/menu-logado.js"></script>
<script type="module">

    import { signOut }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import { auth } from "/js/firebase.js";

    const instanceAtual =
        document.body.dataset.applicationInstance;

    const instanceAnterior =
        localStorage.getItem("trocabookInstance");

    if (instanceAnterior && instanceAnterior !== instanceAtual) {

        await signOut(auth);

        localStorage.setItem(
            "trocabookInstance",
            instanceAtual
        );

        window.location.href = "/login";

    } else {

        localStorage.setItem(
            "trocabookInstance",
            instanceAtual
        );

    }

</script>
</html>
